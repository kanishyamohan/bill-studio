        </div>
        <div id="bulk-progress" hidden style="font-size:13px; color:var(--fg-muted); padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--surface-muted)"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" data-close id="bulk-cancel">Cancel</button>
        <button class="btn primary" id="bulk-go"><i data-lucide="sparkles"></i> Import</button>
      </div>
    `);
    let status = 'paid';
    document.querySelectorAll('#bulk-status button').forEach(b => b.addEventListener('click', () => {
      status = b.dataset.s;
      document.querySelectorAll('#bulk-status button').forEach(x => x.classList.toggle('active', x === b));
    }));
    document.getElementById('bulk-go').addEventListener('click', async () => {
      const files = Array.from(document.getElementById('bulk-files').files || []);
      if (!files.length) { toast('Pick at least one image'); return; }
      if (files.length > 20) { toast('Max 20 at once — try fewer'); return; }
      await runBulkImport(files, status);
    });
  }

  async function runBulkImport(files, defaultStatus) {
    const btn = document.getElementById('bulk-go');
    const prog = document.getElementById('bulk-progress');
    btn.disabled = true;
    document.getElementById('bulk-cancel').disabled = true;
    prog.hidden = false;
    let done = 0, failed = 0;
    const today = todayISO();
    for (const f of files) {
      prog.innerHTML = `<span class="spinner" style="margin-right:8px"></span> Processing ${done + failed + 1} of ${files.length} — <b>${escapeHtml(f.name)}</b>`;
      renderIcons();
      try {
        const blobs = await fileToImageBlobs(f);
        const prompt = `You are an invoice data extractor. Today is ${today}. Extract invoice data from the attached invoice image(s).

Respond with ONLY a JSON object. Do not write any text before or after. Start your reply with { and end with }. Match this schema:
{
  "customer": { "name": "string", "address": "string", "gstNumber": "string", "panNumber": "string", "email": "string" },
  "items": [ { "description": "string", "qty": number, "rate": number } ],
  "currency": "INR|USD|EUR|GBP|AUD|CAD|SGD|AED",
  "gstPercent": number,
  "discount": number,
  "dueDays": number,
  "notes": "string",
  "number": "string (invoice number if visible)",
  "issueDate": "string YYYY-MM-DD if visible",
  "dueDate": "string YYYY-MM-DD if visible"
}

Read the dates, invoice number, line items, totals and all customer information exactly as printed on the image(s). If any field is not visible, leave it empty. Respond with a JSON object only.`;
        const imgs = blobs.slice(0, 5);
        const data = await sample.json(prompt, { modelTier: 'complex', images: imgs });
        const inv = {
          id: uid(),
          number: data.number || nextInvoiceNumber(),
          status: defaultStatus,
          currency: data.currency || 'INR',
          issueDate: data.issueDate || today,
          dueDate: data.dueDate || (typeof data.dueDays === 'number' ? addDaysISO(data.issueDate || today, data.dueDays) : addDaysISO(data.issueDate || today, 14)),
          customer: {
            name: data.customer?.name || 'Imported invoice',
            address: data.customer?.address || '',
            gstNumber: data.customer?.gstNumber || '',
            panNumber: data.customer?.panNumber || '',
            email: data.customer?.email || '',
          },
          items: (Array.isArray(data.items) && data.items.length ? data.items : [{description: 'Imported', qty: 1, rate: 0}])
            .map(it => ({ id: uid(), description: it.description || '', qty: Number(it.qty) || 1, rate: Number(it.rate) || 0 })),
          gstPercent: Number(data.gstPercent) || 0,
          discount: Number(data.discount) || 0,
          notes: data.notes || '',
          bankId: (state.banks.find(b => b.type === 'domestic') || state.banks[0])?.id || '',
          methodIds: [],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          imported: true,
        };
        await db.doc('invoices/' + inv.id).set(inv);
        done++;
      } catch(e) {
        console.error('Import failed for', f.name, e);
        failed++;
      }
    }
    prog.innerHTML = `Done. Imported ${done}${failed ? ` · ${failed} failed` : ''}.`;
    btn.disabled = false;
    document.getElementById('bulk-cancel').disabled = false;
    toast(`Imported ${done} invoice${done === 1 ? '' : 's'}${failed ? ` (${failed} failed)` : ''}`);
    setTimeout(closeModal, 900);
  }

  function openModal(html) {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="modal">${html}</div>`;
    m.classList.add('open');
    m.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
    m.addEventListener('click', e => { if (e.target === m) closeModal(); }, { once: true });
    renderIcons();
  }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    // Routing the hash is enough; readRoute always refreshes #create with today's data.
    location.hash = t.dataset.tab;
  }));

  // Re-render Lucide icons once the lib arrives (script loads async after inline script)
  if (document.readyState !== 'loading') {
    setTimeout(() => { renderIcons(); updateThemeIcon(); }, 0);
  } else {
    document.addEventListener('DOMContentLoaded', () => { renderIcons(); updateThemeIcon(); });
  }
  window.addEventListener('load', () => { renderIcons(); updateThemeIcon(); });

  wirePaste();
  init();
})();
</script>
